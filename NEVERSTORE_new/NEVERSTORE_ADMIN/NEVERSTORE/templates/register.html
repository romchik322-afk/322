{% block title %}Реєстрація — NEVERSTORE{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">NEVER ID</span><h1>Створи акаунт.</h1><p class="muted">Зберігай ігри, оцінки та свою бібліотеку.</p><form method="post" class="auth-form">{% csrf_token %}{{ form.as_p }}<button class="btn" type="submit">Створити акаунт</button></form><p class="auth-foot">Вже маєш акаунт? <a href="{% url 'login' %}">Увійти</a></p></div></div>{% endblock %}
